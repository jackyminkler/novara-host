name: CI

# The gate documented in CONTRIBUTING.md and ENGINEERING.md §8. Until this existed,
# nothing enforced it outside Jacky's machine.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feature handbook is up to date
        # The handbook is generated from docs/features/*.md. Editing a feature doc
        # without regenerating leaves a published copy that quietly disagrees with
        # the source, which is the drift the whole system exists to prevent.
        run: python3 scripts/eng/build_feature_handbook.py --check

  rules-boundary:
    name: Rules-ownership boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: firebase.json must have no firestore section
        # Reads the parsed structure, not a grep. A grep answers "does this string
        # appear" — including inside a comment — never "does this key exist".
        run: |
          node -e '
            const c = require("./firebase.json");
            if ("firestore" in c) {
              console.error("::error::firebase.json has a firestore section. This repo must" +
                            " never be able to deploy the shared ruleset. See ADR-0001 in" +
                            " the consumer repo.");
              process.exit(1);
            }
            console.log("No firestore section. Boundary intact.");
          '

      - name: No collection-group rules proposed in pending-rules.md
        # Collection-group rules span both products in the shared ruleset, so a rule
        # written for one silently governs the other.
        #
        # Scans ONLY fenced code blocks. A rule proposal is code; the surrounding prose
        # discusses rules, and this file's own warning against collection-group rules
        # quotes the pattern verbatim. Grepping the whole file matched that warning and
        # failed the build on the first run -- a grep answers "does this string appear",
        # never "does this thing exist". See ENGINEERING.md section 4.
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib

          f = pathlib.Path("docs/pending-rules.md")
          if not f.exists():
              print("No pending-rules.md."); sys.exit(0)

          text = f.read_text(encoding="utf-8")
          blocks = re.findall(r"^```[^\n]*\n(.*?)^```", text, re.M | re.S)
          if not blocks:
              print("No fenced rule blocks to check."); sys.exit(0)

          pattern = re.compile(r"match\s+/\{path=\*\*\}/")
          bad = [b for b in blocks if pattern.search(b)]
          if bad:
              print("::error::pending-rules.md proposes a collection-group rule. Those "
                    "match the consumer app's subcollections too in the shared ruleset. "
                    "See CLAUDE.md.")
              for b in bad:
                  for line in b.splitlines():
                      if pattern.search(line):
                          print(f"  {line.strip()}")
              sys.exit(1)
          print(f"Checked {len(blocks)} fenced block(s). No collection-group rules proposed.")
          EOF
